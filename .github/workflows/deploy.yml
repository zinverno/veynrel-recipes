name: Deploy community
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm test
      - name: Enforce immutable published versions
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/catalog-published; then
            CATALOG_BASE=$(git rev-parse origin/catalog-published) npm run validate
          fi
      - run: npm run build
      - name: Reserve immutable publication baseline before deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/catalog-published; then
            checkpoint=$(git commit-tree HEAD^{tree} -p origin/catalog-published -m "Reserve catalog from $GITHUB_SHA")
          else
            checkpoint=$(git commit-tree HEAD^{tree} -m "Reserve catalog from $GITHUB_SHA")
          fi
          git push origin "$checkpoint:refs/heads/catalog-published"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
